

<div mat-dialog-actions>

<form [formGroup]="DeleteMemberList">
  <div *ngFor="let member of members">
    <label>
      <input type="radio" formControlName="seleccion" [value]="member">
      {{ member }}
    </label>
  </div>

  <div mat-dialog-actions>
    <button mat-button [mat-dialog-close]="false">Cancel</button>
    <button mat-button (click)="onSubmitMemberToDelete()" cdkFocusInitial>
      Done
    </button>
  </div>
</form>
