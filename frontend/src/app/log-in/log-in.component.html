<h2>Log in</h2>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <label for="username"
        >Username:

        <input id="username" formControlName="username" />
    </label>

    <label for="password"
        >Password:

        <input id="password" type="password" formControlName="password" />
    </label>

    <button type="submit" [disabled]="!loginForm.valid">Submit</button>
    @if (error()) {
        <p>
            {{ error() }}
        </p>
    }
</form>
