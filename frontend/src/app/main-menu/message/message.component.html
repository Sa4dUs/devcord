<div class="chat-container">
  <h2>Chat del canal</h2>

<div class="messages">
  <div *ngFor="let msg of messages">
    {{ msg | json }}
  </div>
</div>


  <div class="input">
    <input type="text" [(ngModel)]="messageInput" placeholder="Escribe un mensaje..." />
    <button (click)="sendMessage()">Enviar</button>
  </div>
</div>
